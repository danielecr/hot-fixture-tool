version: 2
project_name: hot-fixture-tool
builds:
  - id: server
    dir: hfitd
    main: ./cmd/hfitd/main.go
    binary: hfitd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
  - id: cli-admin
    dir: hfitd
    main: ./cmd/hfitd-cli/main.go
    binary: hfitd-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
  - id: client
    dir: hfit
    main: ./main.go
    binary: hfit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    files:
      - LICENSE
      - README.md
      # - "build/plugins/*"
      - src: "hfitd/systemd/hfitd.service"
        dst: "systemd/hfitd.service"
      - src: "hfitd/systemd/hfitd.socket"  
        dst: "systemd/hfitd.socket"
      - src: "hfitd/systemd/hfitd.conf"
        dst: "systemd/hfitd.conf"
      - src: "hfitd/.env.example"
        dst: "hfitd.env.example"

nfpms:
  - id: hfitd-package
    package_name: hfitd
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Daniele Cruciani
    homepage: https://github.com/danielecr/hot-fixture-tool
    maintainer: Daniele Cruciani <daniele@smartango.com>
    description: |-
      Hot Fixture Tool Daemon - Database fixture management server
      A powerful tool for managing database fixtures and test data.
    license: "LICENSE"
    formats:
      - deb
      - rpm
    contents:
      - src: "hfitd/systemd/hfitd.service"
        dst: "/lib/systemd/system/hfitd.service"
      - src: "hfitd/systemd/hfitd.socket"
        dst: "/lib/systemd/system/hfitd.socket"  
      - src: "hfitd/systemd/hfitd.conf"
        dst: "/usr/lib/tmpfiles.d/hfitd.conf"
      - src: "hfitd/.env.example"
        dst: "/etc/hfitd/.env"
        type: config|noreplace
    scripts:
      preinstall: "hfitd/scripts/preinstall.sh"
      postinstall: "hfitd/scripts/postinstall.sh"
      preremove: "hfitd/scripts/preremove.sh"
      postremove: "hfitd/scripts/postremove.sh"

dockers_v2:
  - id: hfitd
    dockerfile: hfitd/Dockerfile
    ids:
      - server
      - cli-admin
    images:
      - "ghcr.io/{{ .Env.GITHUB_USER }}/hfitd"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - "hfitd/.env.example"
    labels:
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"

changelog:
  sort: desc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: danielecr
    name: hot-fixture-tool