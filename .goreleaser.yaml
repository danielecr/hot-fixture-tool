project_name: hot-fixture-tool
builds:
  - id: server
    dir: hfitd
    main: ./cmd/hfitd/main.go
    binary: hfitd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
  - id: cli-admin
    dir: hfitd
    main: ./cmd/hfitd-cli/main.go
    binary: hfitd-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
  - id: client
    dir: hfit
    main: ./main.go
    binary: hfit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    format: tar.gz
    files:
      - LICENSE
      - README.md
      # - "build/plugins/*"
      - src: "hfitd/systemd/hfitd.service"
        dst: "systemd/hfitd.service"
      - src: "hfitd/systemd/hfitd.socket"  
        dst: "systemd/hfitd.socket"
      - src: "hfitd/systemd/hfitd.conf"
        dst: "systemd/hfitd.conf"
      - src: "hfitd/.env.example"
        dst: "hfitd.env.example"

nfpms:
  - id: hfitd-package
    package_name: hfitd
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Daniele Cruciani
    homepage: https://github.com/danielecr/hot-fixture-tool
    maintainer: Daniele Cruciani <daniele@smartango.com>
    description: |-
      Hot Fixture Tool Daemon - Database fixture management server
      A powerful tool for managing database fixtures and test data.
    license: "LICENSE"
    formats:
      - deb
      - rpm
    builds:
      - server
      - cli-admin
    contents:
      - src: "hfitd/systemd/hfitd.service"
        dst: "/lib/systemd/system/hfitd.service"
      - src: "hfitd/systemd/hfitd.socket"
        dst: "/lib/systemd/system/hfitd.socket"  
      - src: "hfitd/systemd/hfitd.conf"
        dst: "/usr/lib/tmpfiles.d/hfitd.conf"
      - src: "hfitd/.env.example"
        dst: "/etc/hfitd/.env"
        type: config|noreplace
    scripts:
      preinstall: "hfitd/scripts/preinstall.sh"
      postinstall: "hfitd/scripts/postinstall.sh"
      preremove: "hfitd/scripts/preremove.sh"
      postremove: "hfitd/scripts/postremove.sh"

dockers:
  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_USER }}/hfitd:{{ .Version }}-amd64"
    dockerfile: Dockerfile
    build_flag_templates:
      - --label=org.opencontainers.image.title={{.ProjectName}}
      - --label=org.opencontainers.image.version={{.Version}}
      - --label=org.opencontainers.image.created={{.Date}}
      - --label=org.opencontainers.image.revision={{.FullCommit}}
      - --platform=linux/amd64
    goos: linux
    goarch: amd64
    ids:
      - server
    dir: hfitd
  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_USER }}/hfitd:{{ .Version }}-arm64"
    dockerfile: Dockerfile
    build_flag_templates:
      - --label=org.opencontainers.image.title={{.ProjectName}}
      - --label=org.opencontainers.image.version={{.Version}}
      - --label=org.opencontainers.image.created={{.Date}}
      - --label=org.opencontainers.image.revision={{.FullCommit}}
      - --platform=linux/arm64
    goos: linux
    goarch: arm64
    ids:
      - server
    dir: hfitd

docker_manifests:
  - name_template: "ghcr.io/{{ .Env.GITHUB_USER }}/hfitd:{{ .Version }}"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_USER }}/hfitd:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_USER }}/hfitd:{{ .Version }}-arm64"
  - name_template: "ghcr.io/{{ .Env.GITHUB_USER }}/hfitd:latest"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_USER }}/hfitd:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_USER }}/hfitd:{{ .Version }}-arm64"

changelog:
  sort: desc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: danielecr
    name: hot-fixture-tool