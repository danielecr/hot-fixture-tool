# Hot Fixture Tool Daemon temporary files configuration
# Type Path                    Mode User  Group Age Argument

# Runtime directory for admin socket
d     /run/hfitd              0755 hfitd hfitd -   -

# State directory for data storage  
d     /var/lib/hfitd          0755 hfitd hfitd -   -

# Log directory
d     /var/log/hfitd          0755 hfitd hfitd -   -

# Configuration directory
d     /etc/hfitd              0755 root  root  -   -