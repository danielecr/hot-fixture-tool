
name: Release Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write # needed for keyless signing
  attestations: write # needed for provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if tag is on main branch
        run: |
          # Get the branch that contains this tag
          TAG_BRANCH=$(git branch -r --contains ${{ github.ref_name }} | grep 'origin/main' | head -1)
          
          if [ -z "$TAG_BRANCH" ]; then
            echo "Error: Tag ${{ github.ref_name }} is not on main branch"
            echo "Available branches containing this tag:"
            git branch -r --contains ${{ github.ref_name }}
            echo ""
            echo "Releases can only be created from main branch"
            exit 1
          else
            echo "Tag ${{ github.ref_name }} found on main branch"
          fi
        shell: bash

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.9

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Docker info
        run: |
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "GitHub actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          docker info
          
      - name: Build and release with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip=chocolatey,archive,scoop,winget,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: danielecr
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Generate build provenance
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './dist/checksums.txt'