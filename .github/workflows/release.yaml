
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write # needed for keyless signing
  attestations: write # needed for provenance

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if tag is on main branch
        run: |
          # Get the branch that contains this tag
          TAG_BRANCH=$(git branch -r --contains ${{ github.ref_name }} | grep 'origin/main' | head -1)
          
          if [ -z "$TAG_BRANCH" ]; then
            echo "Error: Tag ${{ github.ref_name }} is not on main branch"
            echo "Available branches containing this tag:"
            git branch -r --contains ${{ github.ref_name }}
            echo ""
            echo "Releases can only be created from main branch"
            exit 1
          else
            echo "Tag ${{ github.ref_name }} found on main branch"
          fi
        shell: bash

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up QEMU (Linux only)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx (Linux only)
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        if: runner.os == 'Linux'
        uses: sigstore/cosign-installer@v3.4.0

      - name: Install Syft
        if: runner.os == 'Linux'
        uses: anchore/sbom-action/download-syft@v0.20.9

      - name: Install Chocolatey CLI (Windows only)
        if: runner.os == 'Windows'
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        shell: powershell

      - name: Log in to GitHub Container Registry (Linux only)
        if: runner.os == 'Linux'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Docker info (Linux only)
        if: runner.os == 'Linux'
        run: |
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "GitHub actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          docker info
          
      - name: Build and release (Linux - with multi-arch Docker)
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip=chocolatey
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: danielecr
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Release Chocolatey package only (Windows)
        if: runner.os == 'Windows'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip=aur,aur-source,before,docker,homebrew,ko,makeself,nfpm,nix,notarize,publish,sbom,scoop,sign,snapcraft,winget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: danielecr
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

      - name: Push Chocolatey package manually
        if: runner.os == 'Windows'
        run: |
          $nupkg = Get-ChildItem -Path dist -Filter '*.nupkg' | Select-Object -First 1
          if ($nupkg) {
            choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
          } else {
            Write-Error 'No .nupkg file found in dist directory.'
            exit 1
          }
        shell: pwsh

      - name: Generate build provenance (Linux only)
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './dist/checksums.txt'