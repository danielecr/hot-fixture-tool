name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if tag is on main branch
        run: |
          # Get the branch that contains this tag
          TAG_BRANCH=$(git branch -r --contains ${{ github.ref_name }} | grep 'origin/main' | head -1)
          
          if [ -z "$TAG_BRANCH" ]; then
            echo "Error: Tag ${{ github.ref_name }} is not on main branch"
            echo "Available branches containing this tag:"
            git branch -r --contains ${{ github.ref_name }}
            echo ""
            echo "Releases can only be created from main branch"
            exit 1
          else
            echo "Tag ${{ github.ref_name }} found on main branch"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Docker info
        run: |
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "GitHub actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          docker info
          
      - name: Build and release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: danielecr
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}