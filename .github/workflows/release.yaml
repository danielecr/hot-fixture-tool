name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write # needed for keyless signing
  attestations: write # needed for provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if tag is on main branch
        run: |
          # Get the branch that contains this tag
          TAG_BRANCH=$(git branch -r --contains ${{ github.ref_name }} | grep 'origin/main' | head -1)
          
          if [ -z "$TAG_BRANCH" ]; then
            echo "Error: Tag ${{ github.ref_name }} is not on main branch"
            echo "Available branches containing this tag:"
            git branch -r --contains ${{ github.ref_name }}
            echo ""
            echo "Releases can only be created from main branch"
            exit 1
          else
            echo "Tag ${{ github.ref_name }} found on main branch"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.9

      - name: Install Chocolatey CLI  
        run: |
          # Install chocolatey using the official installer adapted for Linux/CI
          sudo apt-get update && sudo apt-get install -y mono-complete
          curl -s https://api.nuget.org/v3-flatcontainer/chocolatey/0.12.1/chocolatey.0.12.1.nupkg -o /tmp/choco.nupkg
          sudo mkdir -p /opt/chocolatey && cd /opt/chocolatey
          sudo unzip -q /tmp/choco.nupkg
          sudo chmod +x tools/chocolateyInstall/choco.exe
          echo '#!/bin/bash' | sudo tee /usr/local/bin/choco > /dev/null
          echo 'exec mono /opt/chocolatey/tools/chocolateyInstall/choco.exe "$@"' | sudo tee -a /usr/local/bin/choco > /dev/null
          sudo chmod +x /usr/local/bin/choco

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Docker info
        run: |
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "GitHub actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          docker info
          
      - name: Build and release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: danielecr
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './dist/checksums.txt'