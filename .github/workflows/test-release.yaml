name: Test Release Configuration

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'snapshot'
        type: choice
        options:
        - snapshot
        - build-only
        - dry-run

jobs:
  test-release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        install-only: true

    - name: Install Chocolatey CLI (Windows only)
      if: runner.os == 'Windows'
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
      shell: powershell

    # Set up Docker Buildx and QEMU for multi-arch builds (Linux only)
    - name: Set up Docker Buildx
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@v3

    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all


    - name: Test GoReleaser - Snapshot (Linux - with multi-arch Docker)
      if: ${{ github.event.inputs.test_type == 'snapshot' && runner.os == 'Linux' }}
      run: goreleaser release --snapshot --clean --skip=sign,sbom,chocolatey
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USER: danielecr

    - name: Test GoReleaser - Snapshot (Windows - Chocolatey only)
      if: ${{ github.event.inputs.test_type == 'snapshot' && runner.os == 'Windows' }}
      run: goreleaser release --snapshot --clean --skip=sign,sbom,scoop,docker,nfpm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USER: danielecr
        CHOCOLATEY_API_KEY: "dummy-key-for-testing"

    - name: Test GoReleaser - Build Only
      if: ${{ github.event.inputs.test_type == 'build-only' }}
      run: goreleaser build --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Test GoReleaser - Dry Run
      if: ${{ github.event.inputs.test_type == 'dry-run' }}
      run: goreleaser check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: List generated artifacts (if any)
      if: ${{ github.event.inputs.test_type == 'snapshot' || github.event.inputs.test_type == 'build-only' }}
      run: |
        echo "Generated artifacts:"
        ls -la dist/ || echo "No dist directory found"
      shell: bash

    - name: Upload test artifacts (Linux)
      if: ${{ github.event.inputs.test_type == 'snapshot' && runner.os == 'Linux' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-release-artifacts-linux
        path: dist/
        retention-days: 1

    - name: Upload test artifacts (Windows)
      if: ${{ github.event.inputs.test_type == 'snapshot' && runner.os == 'Windows' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-release-artifacts-windows
        path: dist/
        retention-days: 1