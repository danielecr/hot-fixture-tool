name: Test Release Configuration

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'snapshot'
        type: choice
        options:
        - snapshot
        - build-only
        - dry-run

jobs:
  test-goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        install-only: true

    - name: Install Chocolatey CLI  
      run: |
        # Install chocolatey using the official installer adapted for Linux/CI
        sudo apt-get update && sudo apt-get install -y mono-complete
        curl -s https://api.nuget.org/v3-flatcontainer/chocolatey/0.12.1/chocolatey.0.12.1.nupkg -o /tmp/choco.nupkg
        sudo mkdir -p /opt/chocolatey && cd /opt/chocolatey
        sudo unzip -q /tmp/choco.nupkg
        sudo chmod +x tools/chocolateyInstall/choco.exe
        echo '#!/bin/bash' | sudo tee /usr/local/bin/choco > /dev/null
        echo 'exec mono /opt/chocolatey/tools/chocolateyInstall/choco.exe "$@"' | sudo tee -a /usr/local/bin/choco > /dev/null
        sudo chmod +x /usr/local/bin/choco

    - name: Test GoReleaser - Snapshot
      if: ${{ github.event.inputs.test_type == 'snapshot' }}
      run: goreleaser release --snapshot --clean --skip=sign,sbom
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHOCOLATEY_API_KEY: "dummy-key-for-testing"

    - name: Test GoReleaser - Build Only
      if: ${{ github.event.inputs.test_type == 'build-only' }}
      run: goreleaser build --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Test GoReleaser - Dry Run
      if: ${{ github.event.inputs.test_type == 'dry-run' }}
      run: goreleaser check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: List generated artifacts (if any)
      if: ${{ github.event.inputs.test_type == 'snapshot' || github.event.inputs.test_type == 'build-only' }}
      run: |
        echo "Generated artifacts:"
        ls -la dist/ || echo "No dist directory found"
        
    - name: Upload test artifacts
      if: ${{ github.event.inputs.test_type == 'snapshot' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-release-artifacts
        path: dist/
        retention-days: 1